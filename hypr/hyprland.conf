# ============================================================
# MONITOR
# ============================================================
monitor = , 1920x1080@144, auto, 1


# ============================================================
# AUTOSTART
# ============================================================
exec-once = /run/current-system/sw/bin/gnome-keyring-daemon --start --components=secrets
exec-once = /run/current-system/sw/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = hyprpaper
exec-once = mako
exec-once = hyprctl setcursor Bibata-Modern-Classic 24


# ============================================================
# ENVIRONMENT
# ============================================================
env = LIBVA_DRIVER_NAME, radeonsi
env = WLR_NO_HARDWARE_CURSORS, 1
env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE, 24


# ============================================================
# INPUT
# ============================================================
input {
    kb_layout = us
    accel_profile = flat
    sensitivity = 0
    follow_mouse = 1
    numlock_by_default = true
    touchpad {
        natural_scroll = false
    }
}


# ============================================================
# LAYOUT
# ============================================================
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(aaee66ff) rgba(88cc44ff) 45deg
    col.inactive_border = rgba(1a1a2eff)
    layout = master
    resize_on_border = true
}

master {
    new_status = slave
    mfact = 0.55
}

dwindle {
    pseudotile = true
    preserve_split = true
}


# ============================================================
# APPEARANCE
# ============================================================
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.9

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(0, 0, 0, 0.4)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 4, smooth, slide
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 10, smooth, slidefade
}


# ============================================================
# WINDOW RULES
# ============================================================
windowrulev2 = float, class:(loupe)
windowrulev2 = float, class:(dolphin)
windowrulev2 = float, class:(nwg-look)
windowrulev2 = float, class:(qt6ct)
windowrulev2 = fullscreenstate 0 2, class:(steam_app_.*)


# ============================================================
# KEYBINDS
# ============================================================
$mod = SUPER

# Apps
bind = $mod, Q,     exec, alacritty
bind = $mod, SPACE, exec, wofi --show drun

# Window management
bind = $mod, escape,    killactive
bind = $mod, F,         fullscreen
bind = $mod, T,         togglefloating
bind = $mod, M,         exit

# Show desktop / minimize all
bind = $mod, D,         togglespecialworkspace, minimized
bind = $mod SHIFT, D,   movetoworkspace, special:minimized

# Move focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Move windows between positions
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Resize windows
bind = $mod CTRL, left,  resizeactive, -50 0
bind = $mod CTRL, right, resizeactive, 50 0
bind = $mod CTRL, up,    resizeactive, 0 -50
bind = $mod CTRL, down,  resizeactive, 0 50

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Window cycling
bind = ALT,	Tab, 	cyclenext
bind = ALT 	SHIFT, 	Tab, cyclenext, prev

# Screenshot
bind = , Print, exec, grimblast copy area

# Volume
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
